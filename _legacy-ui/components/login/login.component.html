<div class="login-page">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1 text-center">Resource Management</h1>
      <p class="text-muted text-center mb-4">Sign in to continue</p>

      @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" class="form-control"
                 [(ngModel)]="username" required autocomplete="username">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control"
                 [(ngModel)]="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary w-100"
                [disabled]="loginForm.invalid || loading">
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
