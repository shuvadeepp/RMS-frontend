<h2 class="h4 mb-3">Search Employees</h2>

<div class="card mb-4">
  <div class="card-body">
    <form (ngSubmit)="search()">
      <div class="row g-3">
        <div class="col-md-4">
          <label for="designation" class="form-label">Designation</label>
          <select id="designation" name="designation" class="form-select" [(ngModel)]="filters.designation">
            <option value="">Any</option>
            @for (designation of designations; track designation) {
              <option [value]="designation">{{ designation }}</option>
            }
          </select>
        </div>

        <div class="col-md-4">
          <label for="department" class="form-label">Department</label>
          <select id="department" name="department" class="form-select" [(ngModel)]="filters.department">
            <option value="">Any</option>
            @for (department of departments; track department) {
              <option [value]="department">{{ department }}</option>
            }
          </select>
        </div>

        <div class="col-md-4">
          <label for="minExperience" class="form-label">Min. experience (years)</label>
          <input id="minExperience" name="minExperience" type="number" min="0" step="0.5"
                 class="form-control" [(ngModel)]="filters.minExperience">
        </div>

        <div class="col-12">
          <label class="form-label">
            Skills <span class="text-muted small">(matches any selected)</span>
          </label>
          <div class="skill-box border rounded p-2">
            @for (skill of skills; track skill) {
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" [id]="'skill-' + skill"
                       [checked]="isSkillSelected(skill)" (change)="toggleSkill(skill)">
                <label class="form-check-label" [for]="'skill-' + skill">{{ skill }}</label>
              </div>
            } @empty {
              <span class="text-muted small">No skills loaded.</span>
            }
          </div>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary me-2" [disabled]="loading">
          {{ loading ? 'Searching...' : 'Search' }}
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="reset()">Reset</button>
      </div>
    </form>
  </div>
</div>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

@if (searched && !loading) {
  <app-employee-table [employees]="employees" />
}
